<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OT Detail</title>

<style>
body { font-family:sans-serif; padding:20px; background:#f9f9f9;}

.summary {
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

table { width:100%; border-collapse:collapse; background:white;}
th,td { border:1px solid #ddd; padding:8px; text-align:center;}
th { background:#f44336; color:white;}

.dayoff { background:#eee; }
.white  { background:#fff; }
.yellow { background:#fff8c4; }
.red    { background:#ffcdd2; }
</style>
</head>

<body>

<h2>⏱️ รายละเอียด OT</h2>

<div id="summary" class="summary"></div>

<table>
<thead>
<tr>
<th>วันที่</th>
<th>กะ</th>
<th>ชั่วโมง</th>
<th>ยอดขาย</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

<tfoot id="footer"></tfoot>

</table>

<script>

const data = JSON.parse(sessionStorage.getItem("empDetail") || "{}");
const allDates = JSON.parse(sessionStorage.getItem("allDates") || "[]");
const duplicates = JSON.parse(sessionStorage.getItem("duplicates") || "[]");

const grouped = {};
const dailySales = data.dailySales || {};

let totalHours = 0;
let totalSales = 0;
let workDays = 0;

(data.detail || []).forEach(d=>{
  if (!grouped[d.date]){
    grouped[d.date] = { shifts:[], total:0 };
  }
  grouped[d.date].shifts.push(d.shift);
  grouped[d.date].total += d.hours;
});

const tbody = document.getElementById("tableBody");

tbody.innerHTML = allDates.map(date=>{

  const g = grouped[date];
  const sales = dailySales[date] || 0;

  if (!g){
    return `<tr class="dayoff"><td>${date}</td><td colspan="2">day off</td><td>0</td></tr>`;
  }

  totalHours += g.total;
  totalSales += sales;
  workDays++;

  const hasDuplicate = duplicates.some(d => d.name === data.name && d.date === date);

  let rowClass = "white";
  if (g.total > 14 || hasDuplicate) rowClass = "red";
  else if (g.total > 9) rowClass = "yellow";

  return `
    <tr class="${rowClass}">
      <td>${date}</td>
      <td>${g.shifts.join(", ")}</td>
      <td>${g.total}</td>
      <td>${Number(sales).toLocaleString()}</td>
    </tr>
  `;

}).join("");

document.getElementById("footer").innerHTML = `
<tr>
  <td><b>รวม</b></td>
  <td>-</td>
  <td><b>${totalHours}</b></td>
  <td><b>${Number(totalSales).toLocaleString()}</b></td>
</tr>
`;

document.getElementById("summary").innerHTML = `
<b>👤 ${data.name}</b><br><br>

📊 สิทธิวันหยุด: ${data.leaveQuota} วัน 
(${data.leaveBase} + ${data.leaveAcc} + ${data.holiday})<br>

🟫 หยุดจริง: ${data.offDays} วัน<br>
⚠️ ขาดวันหยุด: ${data.otDays} วัน<br><br>

🔥 OT วัน: ${data.otDays} วัน<br>
🔥 OT ชั่วโมง: ${data.otHours} ชม<br>

💰 ค่า OT: ${Number(data.otPay).toLocaleString()} บาท<br><br>

💰 ยอดขายรวม: ${Number(totalSales).toLocaleString()} บาท<br>
⏱️ ชั่วโมงรวม: ${totalHours} ชั่วโมง
`;

</script>

</body>
</html>
