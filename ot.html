<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OT Detail</title>

<style>
body { font-family:sans-serif; padding:20px; background:#f9f9f9;}
table { width:100%; border-collapse:collapse; background:white;}
th,td { border:1px solid #ddd; padding:8px; text-align:center;}
th { background:#f44336; color:white;}

.dayoff { background:#eee; }      /* เทา */
.yellow { background:#fff8c4; }   /* เหลือง */
.red { background:#ffcdd2; }      /* แดง */
</style>
</head>

<body>

<h2>⏱️ รายละเอียด OT</h2>

<table>
<thead>
<tr>
<th>วันที่</th>
<th>กะ</th>
<th>ชั่วโมง</th>
<th>ยอดขาย</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>

const data = JSON.parse(sessionStorage.getItem("empDetail") || "{}");
const allDates = JSON.parse(sessionStorage.getItem("allDates") || "[]");
const duplicates = JSON.parse(sessionStorage.getItem("duplicates") || "[]");

const detail = data.detail || [];
const dailySales = data.dailySales || {};

const grouped = {};

// 🔥 group ตามวัน
detail.forEach(d=>{
  if (!grouped[d.date]){
    grouped[d.date] = {
      shifts:[],
      total:0
    };
  }

  grouped[d.date].shifts.push(d.shift);
  grouped[d.date].total += Number(d.hours||0);
});

const tbody = document.getElementById("tableBody");

tbody.innerHTML = allDates.map(date=>{

  const g = grouped[date];
  const sales = dailySales[date] || 0;

  // 🟫 DAY OFF
  if (!g){
    return `
      <tr class="dayoff">
        <td>${date}</td>
        <td colspan="2">day off</td>
        <td>0</td>
      </tr>
    `;
  }

  // 🔥 เช็ค duplicate เฉพาะวันนั้น
  const hasDuplicate = duplicates.some(d => 
    d.name === data.name && d.date === date
  );

  // 🔥 กำหนดสี
  let rowClass = "yellow"; // default

  if (g.total > 14 || hasDuplicate){
    rowClass = "red";
  }

  return `
    <tr class="${rowClass}">
      <td>${date}</td>
      <td>${g.shifts.join(", ")}</td>
      <td>${g.total}</td>
      <td>${Number(sales).toLocaleString()}</td>
    </tr>
  `;

}).join("");

</script>

</body>
</html>
