<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payroll</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family:sans-serif; text-align:center; padding:20px; background:#f5f5f5;}

table { 
  width:100%; 
  max-width:1300px; 
  margin:auto; 
  border-collapse:collapse; 
  background:white;
}

th,td { border:1px solid #ddd; padding:8px;}
th { background:#d9ead3; }

th.deduct { background:#f4cccc; }
th.total { background:#d9e2f3; }

tr:nth-child(even){ background:#f9f9f9; }

button {
  padding:4px 8px;
  cursor:pointer;
  border:none;
  background:#4CAF50;
  color:white;
  border-radius:4px;
  margin:2px;
}

button:hover { background:#45a049; }

#loading {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<!-- 🔥 dropdown -->
<select id="month">
  <option value="1">มกราคม</option>
  <option value="2">กุมภาพันธ์</option>
  <option value="3">มีนาคม</option>
  <option value="4" selected>เมษายน</option>
  <option value="5">พฤษภาคม</option>
  <option value="6">มิถุนายน</option>
  <option value="7">กรกฎาคม</option>
  <option value="8">สิงหาคม</option>
  <option value="9">กันยายน</option>
  <option value="10">ตุลาคม</option>
  <option value="11">พฤศจิกายน</option>
  <option value="12">ธันวาคม</option>
</select>

<select id="year">
  <option>2569</option>
  <option>2568</option>
</select>

<button onclick="loadData()">โหลด</button>
<button onclick="exportExcel()">📊 Export</button>

<div id="loading">⏳ Loading...</div>

<table>
<thead>
<tr>
<th>ชื่อ</th>
<th>เงินเดือน</th>
<th>โอที</th>
<th>ค่าคอม</th>
<th>โบนัส</th>

<th class="deduct">ประกันสังคม</th>
<th class="deduct">กยศ</th>
<th class="deduct">เงินสะสม</th>
<th class="deduct">มาสาย</th>
<th class="deduct">ค่าไฟ</th>
<th class="deduct">ค่าน้ำ</th>
<th class="deduct">ค่าเสื้อ</th>
<th class="deduct">หักอื่นๆ</th>

<th class="total">รวมเงินได้</th>
<th class="total">รวมหัก</th>
<th class="total">เงินได้สุทธิ</th>
<th class="total">หัก ณ ที่จ่าย</th>
<th class="total">ยอดโอนสุทธิ</th>

<th>จัดการ</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwLGZHD0KVH0dW-tKixUH_zLuAxFA7hGcuZplK0WJ6cvnMSmX2-zVLa50ve-IPdD9JQ/exec";
let dataGlobal = [];

window.onload = loadData;

// ==========================
// โหลดข้อมูล (เหมือนของคุณ + รองรับ dropdown)
// ==========================
async function loadData(){

  document.getElementById("loading").style.display="flex";

  const month = document.getElementById("month").value;
  const year = document.getElementById("year").value;

  try{
    const res = await fetch(
      `${API_URL}?month=${month}&year=${year}`
    );
    const text = await res.text();
    const json = JSON.parse(text);
    
    // 🔥 เช็ค error จาก API
    if (json.error){
      alert("❌ " + json.error);
      document.getElementById("loading").style.display="none";
      return;
    }
    
    const data = json.data || [];
    const allDates = json.allDates || [];

    // 🔥 ของเดิมคุณ (สำคัญ OT)
    sessionStorage.setItem("allDates", JSON.stringify(allDates));
    sessionStorage.setItem("duplicates", JSON.stringify(json.duplicates || []));

    dataGlobal = data;

    renderTable(data);

  }catch(err){
    alert("โหลดข้อมูลผิดพลาด");
  }

  document.getElementById("loading").style.display="none";
}

// ==========================
// render table (เพิ่ม action แต่ไม่ลบของเดิม)
// ==========================
function renderTable(data){

  const tbody = document.getElementById("tableBody");

  tbody.innerHTML = data.map((d,i)=>{

    const income =
      (d.baseSalary||0) +
      (d.otPay||0) +
      (d.commission||0) +
      (d.bonus||0);

    const deduct =
      (d.social||0) +
      (d.loan||0) +
      (d.saving||0) +
      (d.late||0) +
      (d.electric||0) +
      (d.water||0) +
      (d.uniform||0) +
      (d.otherDeduct||0);

    const net = income - deduct;
    const transfer = net - (d.tax||0);

    return `
    <tr>
      <td><b>${d.name}</b></td>

      <td>${f(d.baseSalary)}</td>
      <td>${f(d.otPay)}</td>
      <td>${f(d.commission)}</td>
      <td>${f(d.bonus)}</td>

      <td>${f(d.social)}</td>
      <td>${f(d.loan)}</td>
      <td>${f(d.saving)}</td>

      <td>${f(d.late)}</td>
      <td>${f(d.electric)}</td>
      <td>${f(d.water)}</td>
      <td>${f(d.uniform)}</td>
      <td>${f(d.otherDeduct)}</td>

      <td><b>${f(income)}</b></td>
      <td>${f(deduct)}</td>
      <td>${f(net)}</td>

      <td>${f(d.tax)}</td>
      <td><b>${f(transfer)}</b></td>

      <td>
        <!-- 🔥 ของเดิม -->
        <button onclick="goDetail(${i})">OT</button>

        <!-- 🔥 เพิ่มใหม่ -->
        <button onclick="viewSlip(${i})">Slip</button>
        <button onclick="downloadSlip(${i})">PDF</button>
        <button onclick="sendEmail(${i})">Mail</button>
      </td>
    </tr>`;
  }).join("");
}

// ==========================
// OT (ของเดิมคุณ)
// ==========================
function goDetail(i){
  sessionStorage.setItem("empDetail", JSON.stringify(dataGlobal[i]));
  window.location.href = "ot.html";
}

// ==========================
// เพิ่มใหม่ (ไม่ทับของเดิม)
// ==========================
function viewSlip(i){
  sessionStorage.setItem("empSlip", JSON.stringify(dataGlobal[i]));
  window.open("slip.html");
}

function downloadSlip(i){
  sessionStorage.setItem("empSlip", JSON.stringify(dataGlobal[i]));
  window.open("slip.html?download=1");
}

async function sendEmail(i){
  await fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"sendEmail",
      data: dataGlobal[i]
    })
  });
  alert("ส่งเมลแล้ว");
}

// ==========================
// export (เพิ่มใหม่)
// ==========================
function exportExcel(){

  const rows = dataGlobal.map(d=>{
    const income = d.baseSalary + d.otPay + d.commission + d.bonus;
    const deduct = d.social + d.loan + d.saving + d.late + d.electric + d.water + d.uniform + d.otherDeduct;
    const net = income - deduct;
    const transfer = net - d.tax;

    return {
      "ชื่อ": d.name,
      "เงินเดือน": d.baseSalary,
      "โอที": d.otPay,
      "ค่าคอม": d.commission,
      "โบนัส": d.bonus,
      "ประกันสังคม": d.social,
      "กยศ": d.loan,
      "เงินสะสม": d.saving,
      "มาสาย": d.late,
      "ค่าไฟ": d.electric,
      "ค่าน้ำ": d.water,
      "ค่าเสื้อ": d.uniform,
      "หักอื่น": d.otherDeduct,
      "รวมเงิน": income,
      "หัก": deduct,
      "สุทธิ": net,
      "ภาษี": d.tax,
      "โอน": transfer
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Payroll");
  XLSX.writeFile(wb, "Payroll.xlsx");
}

function f(n){ return Number(n||0).toLocaleString(); }

</script>

</body>
</html>
