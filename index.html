<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payroll</title>

<style>
body { font-family:sans-serif; text-align:center; padding:20px; background:#f5f5f5;}
table { width:100%; max-width:1000px; margin:auto; border-collapse:collapse; background:white;}
th,td { border:1px solid #ddd; padding:8px;}
th { background:#4CAF50; color:white;}

#loading {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<div id="loading">⏳ กำลังโหลด...</div>

<table id="table"></table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwtt_72fV3lV9eTP1gQU3QasG3kul7FABV2umymRLfc8m8D1e82bj3L4WX73i_GJMHy/exec";

let dataGlobal = [];

window.onload = loadData;

async function loadData(){

  const res = await fetch(`${API_URL}?month=เมษายน`);
  const json = await res.json();

  const data = json.data || [];
  const allDates = json.allDates || [];

  sessionStorage.setItem("allDates", JSON.stringify(allDates));
  sessionStorage.setItem("duplicates", JSON.stringify(json.duplicates || []));

  dataGlobal = data;

  renderTable(data);

  document.getElementById("loading").style.display = "none";
}

function renderTable(data){
  document.getElementById("table").innerHTML =
  `<tr>
    <th>ชื่อ</th>
    <th>ชั่วโมง</th>
    <th>OT</th>
    <th>ยอดขาย</th>
    <th>รวม</th>
  </tr>` +
  data.map((d,i)=>`
    <tr onclick="goDetail(${i})">
      <td>${d.name}</td>
      <td>${d.hours}</td>
      <td>${d.otHours}</td>
      <td>${format(d.sales)}</td>
      <td>${format(d.total)}</td>
    </tr>
  `).join("");
}

function goDetail(i){
  sessionStorage.setItem("empDetail", JSON.stringify(dataGlobal[i]));
  window.location.href = "ot.html";
}

function format(n){
  return Number(n||0).toLocaleString();
}
</script>

</body>
</html>
