<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payroll</title>

<style>
body { font-family:sans-serif; text-align:center; padding:20px; background:#f5f5f5;}

table { 
  width:100%; 
  max-width:1200px; 
  margin:auto; 
  border-collapse:collapse; 
  background:white;
}

th,td { border:1px solid #ddd; padding:8px;}
th { background:#d9ead3; color:white;}
th.deduct {
  background:#f4cccc;
  color:white;
}
th.total {
  background:#d9e2f3;
  color:white;
}

tr:nth-child(even){ background:#f9f9f9; }

button {
  padding:4px 8px;
  cursor:pointer;
  border:none;
  background:#4CAF50;
  color:white;
  border-radius:4px;
}

button:hover {
  background:#45a049;
}

#loading {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<div id="loading">⏳ กำลังโหลด...</div>

<table>
<thead>
<tr>
<th>ชื่อ</th>
<th>เงินเดือน</th>
<th>โอที</th>
<th>ค่าคอม</th>
<th>โบนัส</th>

<th class="deduct">ประกันสังคม</th>
<th class="deduct">กยศ</th>
<th class="deduct">เงินสะสม</th>
<th class="deduct">มาสาย</th>
<th class="deduct">ค่าไฟ</th>
<th class="deduct">ค่าน้ำ</th>
<th class="deduct">ค่าเสื้อ</th>
<th class="deduct">หักอื่นๆ</th>

<th class="total">รวมเงินได้</th>
<th class="total">รวมหัก</th>
<th class="total">เงินได้สุทธิ</th>
<th class="total">หัก ณ ที่จ่าย</th>
<th class="total">ยอดโอนสุทธิ</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyMLihULUFndhs2RoK8azHa8ciT4zxnlh4jF6mfrKPULLjJXSJu3eGQZ50bCpwNfAZc/exec";

let dataGlobal = [];

window.onload = loadData;

// ==========================
// 🔥 โหลดข้อมูล
// ==========================
async function loadData(){

  try{
    const res = await fetch(`${API_URL}?month=เมษายน`);
    const json = await res.json();

    const data = json.data || [];
    const allDates = json.allDates || [];

    sessionStorage.setItem("allDates", JSON.stringify(allDates));
    sessionStorage.setItem("duplicates", JSON.stringify(json.duplicates || []));

    dataGlobal = data;

    renderTable(data);

  }catch(err){
    alert("โหลดข้อมูลผิดพลาด");
  }

  document.getElementById("loading").style.display = "none";
}

// ==========================
// 🔥 render ตาราง
// ==========================
function renderTable(data){

  const tbody = document.getElementById("tableBody");

  tbody.innerHTML = data.map((d, i)=>{

    const income =
      (d.baseSalary || 0) +
      (d.otPay || 0) +
      (d.commission || 0) +
      (d.bonus || 0);

    const deduct =
      (d.social || 0) +
      (d.loan || 0) +
      (d.saving || 0) +
      (d.late || 0) +
      (d.electric || 0) +
      (d.water || 0) +
      (d.uniform || 0) +
      (d.otherDeduct || 0);

    const net = income - deduct;
    const transfer = net - (d.tax || 0);

    return `
    <tr>
      <td>
        <button onclick="goDetail(${i})">
          ${d.name}
        </button>
      </td>

      <td>${format(d.baseSalary)}</td>
      <td>${format(d.otPay)}</td>
      <td>${format(d.commission)}</td>
      <td>${format(d.bonus)}</td>

      <td>${format(d.social)}</td>
      <td>${format(d.loan)}</td>
      <td>${format(d.saving)}</td>

      <td>${format(d.late)}</td>
      <td>${format(d.electric)}</td>
      <td>${format(d.water)}</td>
      <td>${format(d.uniform)}</td>
      <td>${format(d.otherDeduct)}</td>

      <td><b>${format(income)}</b></td>
      <td class="deduct">${format(deduct)}</td>
      <td>${format(net)}</td>

      <td class="deduct">${format(d.tax)}</td>
      <td><b>${format(transfer)}</b></td>
    </tr>`;
  }).join("");
}

// ==========================
// 🔥 ไปหน้า OT
// ==========================
function goDetail(i){
  sessionStorage.setItem("empDetail", JSON.stringify(dataGlobal[i]));
  window.location.href = "ot.html";
}

// ==========================
// 🔥 format ตัวเลข
// ==========================
function format(n){
  return Number(n || 0).toLocaleString();
}
</script>

</body>
</html>
