<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family:sans-serif; padding:20px; text-align:center; background:#f5f5f5;}
table { width:100%; max-width:1000px; margin:auto; border-collapse:collapse; background:white;}
th,td { border:1px solid #ddd; padding:8px;}
th { background:#4CAF50; color:white;}
tr:nth-child(even){background:#f9f9f9;}
button{padding:8px 12px; margin:5px;}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<select id="month">
  <option value="เมษายน">เมษายน</option>
</select>

<br>

<button onclick="loadData()">โหลดข้อมูล</button>
<button onclick="goEmployee()">จัดการพนักงาน</button>
<button onclick="exportCSV()">Export</button>

<br><br>

<table id="table"></table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxiCoG-yn0jYJacUzx0pmg-f0qCeMKegc7nalKCfPjxd2dTVO_JVR1BNBUFgAKD2hpj/exec";

let dataGlobal = [];

async function loadData(){

  const month = document.getElementById("month").value;

  const res = await fetch(`${API_URL}?month=${month}`);
  const data = await res.json();

  dataGlobal = data;

  document.getElementById("table").innerHTML =
  `<tr>
    <th>ชื่อ</th>
    <th>ชั่วโมง</th>
    <th>OT</th>
    <th>ยอดขาย</th>
    <th>รวม</th>
  </tr>` +
  data.map(d=>`
    <tr>
      <td>${d.name}</td>
      <td>${d.hours}</td>
      <td>${d.otHours}</td>
      <td>${format(d.sales)}</td>
      <td><b>${format(d.total)}</b></td>
    </tr>
  `).join("");
}

function exportCSV(){
  let csv="ชื่อ,ชั่วโมง,OT,ยอดขาย,รวม\n";
  dataGlobal.forEach(d=>{
    csv+=`${d.name},${d.hours},${d.otHours},${d.sales},${d.total}\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="payroll.csv";
  a.click();
}

function goEmployee(){
  window.location.href="employee.html";
}

function format(n){
  return Number(n||0).toLocaleString();
}
</script>

</body>
</html>
