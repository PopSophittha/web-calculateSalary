<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ระบบเงินเดือน</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family:sans-serif;
  padding:20px;
  background:#f5f5f5;
  text-align:center;
}

h2 {
  margin-bottom:20px;
}

select, button {
  padding:8px 12px;
  margin:5px;
}

table {
  width:100%;
  max-width:1000px;
  margin:auto;
  border-collapse:collapse;
  background:white;
}

th, td {
  border:1px solid #ddd;
  padding:8px;
}

th {
  background:#4CAF50;
  color:white;
}

tr:nth-child(even){
  background:#f9f9f9;
}

#loading {
  display:none;
  font-weight:bold;
}

#detailBox {
  display:none;
  position:fixed;
  top:10%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<select id="month">
  <option value="เมษายน">เมษายน</option>
</select>

<br>

<button onclick="loadData()">โหลดข้อมูล</button>
<button onclick="exportCSV()">Export Excel</button>

<div id="loading">⏳ กำลังโหลด...</div>

<br>

<table id="table"></table>

<!-- 🔍 popup รายละเอียด -->
<div id="detailBox">
  <div id="detailContent"></div>
  <br>
  <button onclick="closeDetail()">ปิด</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxnLm1l08gtxnyzm_LNzRNFNNTanxMIC8PwIFwMbmhZnmHdzZHHXGKLdqXqZ7N6ZQdA/exec";

let payrollData = [];

async function loadData(){

  const month = document.getElementById("month").value;

  document.getElementById("loading").style.display = "block";

  try {
    const res = await fetch(`${API_URL}?month=${month}`);
    const data = await res.json();

    payrollData = data;

    renderTable(data);

  } catch(err){
    alert("โหลดข้อมูลผิดพลาด");
  }

  document.getElementById("loading").style.display = "none";
}

function renderTable(data){

  if (!data || data.length === 0){
    document.getElementById("table").innerHTML = "<tr><td>ไม่มีข้อมูล</td></tr>";
    return;
  }

  document.getElementById("table").innerHTML =
    `<tr>
      <th>ชื่อ</th>
      <th>ชั่วโมง</th>
      <th>OT</th>
      <th>ยอดขาย</th>
      <th>รวม</th>
    </tr>` +
    data.map((d,i)=>`
      <tr onclick="showDetail(${i})" style="cursor:pointer">
        <td>${d.name}</td>
        <td>${d.hours}</td>
        <td>${d.otHours}</td>
        <td>${format(d.sales)}</td>
        <td><b>${format(d.total)}</b></td>
      </tr>
    `).join("");
}

function showDetail(i){

  const d = payrollData[i];

  let html = `
    <b>${d.fullName}</b><br><br>

    💰 เงินเดือน: ${format(d.baseSalary)}<br>
    ⏱️ ชั่วโมง: ${d.hours}<br>
    🔥 OT: ${d.otHours} (${format(d.otPay)})<br>
    📈 คอม: ${format(d.commission)}<br><br>

    ➖ ภาษี: ${format(d.tax)}<br>
    ➖ ประกันสังคม: ${format(d.social)}<br><br>

    <h3>รวมสุทธิ: ${format(d.total)}</h3>
  `;

  document.getElementById("detailContent").innerHTML = html;
  document.getElementById("detailBox").style.display = "block";
}

function closeDetail(){
  document.getElementById("detailBox").style.display = "none";
}

// 📥 export CSV
function exportCSV(){

  let csv = "ชื่อ,ชั่วโมง,OT,ยอดขาย,รวม\n";

  payrollData.forEach(d=>{
    csv += `${d.name},${d.hours},${d.otHours},${d.sales},${d.total}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "payroll.csv";
  a.click();
}

// 💡 format เงิน
function format(n){
  return Number(n || 0).toLocaleString();
}

</script>

</body>
</html>
