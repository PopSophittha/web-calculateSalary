<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payroll</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family:sans-serif; text-align:center; padding:20px; background:#f5f5f5;}

table { width:100%; max-width:1300px; margin:auto; border-collapse:collapse; background:white;}
th,td { border:1px solid #ddd; padding:8px; font-size:14px;}
th { background:#d9ead3;}

th.deduct { background:#f4cccc; }
th.total { background:#d9e2f3; }

tr:nth-child(even){ background:#f9f9f9; }

button {
  padding:4px 8px;
  cursor:pointer;
  border:none;
  background:#4CAF50;
  color:white;
  border-radius:4px;
  margin:2px;
}
button:hover { background:#45a049; }

#loading {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<!-- 🔥 dropdown -->
<select id="month">
  <option>มกราคม</option>
  <option>กุมภาพันธ์</option>
  <option>มีนาคม</option>
  <option selected>เมษายน</option>
</select>

<select id="year">
  <option>2569</option>
  <option>2568</option>
</select>

<button onclick="loadData()">โหลด</button>
<button onclick="exportExcel()">📊 Export Excel</button>

<div id="loading">⏳ Loading...</div>

<table>
<thead>
<tr>
<th>ชื่อ</th>
<th>เงินเดือน</th>
<th>โอที</th>
<th>ค่าคอม</th>
<th>โบนัส</th>

<th class="deduct">ประกันสังคม</th>
<th class="deduct">กยศ</th>
<th class="deduct">เงินสะสม</th>
<th class="deduct">มาสาย</th>
<th class="deduct">ค่าไฟ</th>
<th class="deduct">ค่าน้ำ</th>
<th class="deduct">ค่าเสื้อ</th>
<th class="deduct">หักอื่นๆ</th>

<th class="total">รวมเงินได้</th>
<th class="total">รวมหัก</th>
<th class="total">เงินได้สุทธิ</th>
<th class="total">หัก ณ ที่จ่าย</th>
<th class="total">ยอดโอนสุทธิ</th>

<th>จัดการ</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script>
const API_URL = "YOUR_API_URL";
let dataGlobal = [];

async function loadData(){

  document.getElementById("loading").style.display="flex";

  const month = document.getElementById("month").value;
  const year = document.getElementById("year").value;

  const res = await fetch(`${API_URL}?month=${month}&year=${year}`);
  const json = await res.json();

  dataGlobal = json.data || [];

  renderTable(dataGlobal);

  document.getElementById("loading").style.display="none";
}

function renderTable(data){

  const tbody = document.getElementById("tableBody");

  tbody.innerHTML = data.map((d,i)=>{

    const income = d.baseSalary + d.otPay + d.commission + d.bonus;
    const deduct = d.social + d.loan + d.saving + d.late + d.electric + d.water + d.uniform + d.otherDeduct;
    const net = income - deduct;
    const transfer = net - d.tax;

    return `
    <tr>
      <td><b>${d.name}</b></td>

      <td>${f(d.baseSalary)}</td>
      <td>${f(d.otPay)}</td>
      <td>${f(d.commission)}</td>
      <td>${f(d.bonus)}</td>

      <td>${f(d.social)}</td>
      <td>${f(d.loan)}</td>
      <td>${f(d.saving)}</td>
      <td>${f(d.late)}</td>
      <td>${f(d.electric)}</td>
      <td>${f(d.water)}</td>
      <td>${f(d.uniform)}</td>
      <td>${f(d.otherDeduct)}</td>

      <td><b>${f(income)}</b></td>
      <td>${f(deduct)}</td>
      <td>${f(net)}</td>

      <td>${f(d.tax)}</td>
      <td><b>${f(transfer)}</b></td>

      <td>
        <button onclick="viewSlip(${i})">👁️</button>
        <button onclick="downloadSlip(${i})">💾</button>
        <button onclick="sendEmail(${i})">📧</button>
      </td>
    </tr>`;
  }).join("");
}

function f(n){ return Number(n||0).toLocaleString(); }

//////////////////////////////////////////////////
// 📊 EXPORT EXCEL (ตรง table)
//////////////////////////////////////////////////
function exportExcel(){

  const rows = dataGlobal.map(d=>{
    const income = d.baseSalary + d.otPay + d.commission + d.bonus;
    const deduct = d.social + d.loan + d.saving + d.late + d.electric + d.water + d.uniform + d.otherDeduct;
    const net = income - deduct;
    const transfer = net - d.tax;

    return {
      "ชื่อ": d.name,
      "เงินเดือน": d.baseSalary,
      "โอที": d.otPay,
      "ค่าคอม": d.commission,
      "โบนัส": d.bonus,
      "ประกันสังคม": d.social,
      "กยศ": d.loan,
      "เงินสะสม": d.saving,
      "มาสาย": d.late,
      "ค่าไฟ": d.electric,
      "ค่าน้ำ": d.water,
      "ค่าเสื้อ": d.uniform,
      "หักอื่นๆ": d.otherDeduct,
      "รวมเงินได้": income,
      "รวมหัก": deduct,
      "เงินสุทธิ": net,
      "ภาษี": d.tax,
      "โอน": transfer
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Payroll");

  XLSX.writeFile(wb, "Payroll.xlsx");
}

//////////////////////////////////////////////////
// 👁️ ดูสลิป
//////////////////////////////////////////////////
function viewSlip(i){
  sessionStorage.setItem("empSlip", JSON.stringify(dataGlobal[i]));
  window.open("slip.html");
}

//////////////////////////////////////////////////
// 💾 โหลด PDF
//////////////////////////////////////////////////
function downloadSlip(i){
  sessionStorage.setItem("empSlip", JSON.stringify(dataGlobal[i]));
  window.open("slip.html?download=1");
}

//////////////////////////////////////////////////
// 📧 ส่ง email
//////////////////////////////////////////////////
async function sendEmail(i){

  const emp = dataGlobal[i];

  await fetch(API_URL, {
    method:"POST",
    body: JSON.stringify({
      action:"sendEmail",
      data: emp
    })
  });

  alert("ส่งอีเมลแล้ว");
}
</script>

</body>
</html>
