<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payroll</title>

<style>
body { font-family:sans-serif; text-align:center; padding:20px; background:#f5f5f5;}
table { width:100%; max-width:1000px; margin:auto; border-collapse:collapse; background:white;}
th,td { border:1px solid #ddd; padding:8px;}
th { background:#4CAF50; color:white;}

button {
  padding:8px 12px;
  margin:5px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.btn-main { background:#4CAF50; color:white;}
.btn-emp { background:#2196F3; color:white;}
.btn-export { background:#ff9800; color:white;}

#loading {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  z-index:999;
}
</style>
</head>

<body>

<h2>💰 เงินเดือนทั้งร้าน</h2>

<!-- 🔥 ปุ่มกลับมาแล้ว -->
<button class="btn-main" onclick="loadData()">🔄 โหลดใหม่</button>
<button class="btn-emp" onclick="goEmployee()">👩‍💼 พนักงาน</button>
<button class="btn-export" onclick="exportCSV()">📥 Export</button>

<br><br>

<div id="loading">⏳ กำลังโหลด...</div>

<table id="table"></table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyfELk4BsdyOuwalX3f9_7nY97EgaBbEb06k2n36n2tZ1dXJR20gThLmfq_XSHgmOj6/exec";

let loading = false;
let dataGlobal = [];

// 🔥 โหลดอัตโนมัติ
window.onload = loadData;

async function loadData(){

  if (loading) return;
  loading = true;

  document.getElementById("loading").style.display = "flex";

  try {
    const res = await fetch(`${API_URL}?month=เมษายน`);
    const data = await res.json();

    dataGlobal = data;
    renderTable(data);

  } catch(err){
    alert("โหลดผิดพลาด");
  }

  document.getElementById("loading").style.display = "none";
  loading = false;
}

function renderTable(data){

  document.getElementById("table").innerHTML =
  `<tr>
    <th>ชื่อ</th>
    <th>ชั่วโมง</th>
    <th>OT</th>
    <th>ยอดขาย</th>
    <th>รวม</th>
  </tr>` +
  data.map((d,i)=>`
    <tr onclick="goDetail(${i})" style="cursor:pointer">
      <td>${d.name}</td>
      <td>${d.hours}</td>
      <td>${d.otHours}</td>
      <td>${format(d.sales)}</td>
      <td><b>${format(d.total)}</b></td>
    </tr>
  `).join("");
}

function goDetail(i){
  sessionStorage.setItem("empDetail", JSON.stringify(dataGlobal[i]));
  window.location.href = "ot.html";
}

function goEmployee(){
  window.location.href = "employee.html";
}

function exportCSV(){
  let csv="ชื่อ,ชั่วโมง,OT,ยอดขาย,รวม\n";
  dataGlobal.forEach(d=>{
    csv+=`${d.name},${d.hours},${d.otHours},${d.sales},${d.total}\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="payroll.csv";
  a.click();
}

function format(n){
  return Number(n||0).toLocaleString();
}
</script>

</body>
</html>
